name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r containers/requirements-hpc4.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m prism.cli validate
      - run: bash -n scripts/hpc4/submit.sh scripts/hpc4/job.sbatch scripts/hpc4/env.example.sh
