# Paths are relative to this file. Copy to local.yaml and fill the four choices.
schema_version: 1
output: ../runs/main
choices:
  prompts:
    design: null       # JSONL: {id, messages:[{role,content}]}
    policy: null       # Same format; may equal design; heldout must be disjoint.
    evaluation: null
  sft:
    model: null        # HF repo ID or staged local snapshot
    revision: null     # Immutable 40-character HF commit, also for local snapshots
  judge:
    model: null        # Text-generation HF model, fixed across all methods
    revision: null
  benchmark:
    path: null         # JSONL: {id,messages,answer}; frozen exact-match benchmark
    name: null
methods: [empirical, a_optimal, prism]
budgets: [256, 512, 1024]
seeds: [11, 23, 37]
runtime:
  device: cuda
  dtype: bfloat16
  local_files_only: true
candidate:
  count: 4
  max_new_tokens: 256
  max_prompt_tokens: 1024
  seed: 20261102
design:
  surrogate_ridge: 0.01
  matrix_ridge: 0.01
  fw_max_iter: 500
  fw_relative_gap: 0.0001
reward:
  max_iter: 2000
  gradient_tolerance: 0.000001
  max_weight_norm: 1000.0 # Failure diagnostic only; NOT a norm constraint or penalty
judge:
  max_new_tokens: 32
  temperature: 1.0
  max_attempts: 3
ppo:
  total_episodes: 4096
  response_length: 256
  learning_rate: 0.000003
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_mini_batches: 1
  num_ppo_epochs: 4
  kl_coef: 0.05
  cliprange: 0.2
  vf_coef: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_target_modules: all-linear
evaluation:
  max_new_tokens: 256
  seed: 314159
