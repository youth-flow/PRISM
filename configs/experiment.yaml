# Final small study. All paths are relative to this file; secrets stay in the environment.
# This file selects the experiment. scripts launch stages; src implements them.
schema_version: 2
output: ../runs/olmo1b-small-v1
execution:
  allow_paid_api_calls: false
choices:
  prompts:
    design: ../data/small/design.jsonl
    policy: ../data/small/policy.jsonl
    evaluation: ../data/small/evaluation.jsonl
  sft:
    model: allenai/OLMo-2-0425-1B-SFT
    revision: 0d85a3d037876ce6ac7d4311d994400fc66ac27f
  benchmark:
    name: IFEval
    kind: ifeval
    path: ../data/small/ifeval.jsonl
    official_source_path: ../assets/ifeval
    official_source_revision: e6890f85757dd84e27ca6df2dd30651dafad28e0
data:
  source:
    id: HuggingFaceH4/ultrafeedback_binarized
    revision: 3949bf5f8c17c394422ccfab0c31ea9c20bdeb85
    train_split: train_gen
    test_split: test_gen
    prompt_field: prompt
    id_field: prompt_id
  benchmark_source:
    id: google/IFEval
    revision: 966cd89545d6b6acfd7638bc708b98261ca58e84
    split: train
  manifest_path: ../data/small/data.manifest.json
  split_seed: 20261109
  model_context_tokens: 4096
  expected_counts:
    design: 3000
    policy: 2000
    evaluation: 500
    benchmark: 541
  require_disjoint_design_policy: true
methods: [empirical, prism]
budgets: [1024]
seeds: [11, 23]
sampling:
  budget_coupling: independent
runtime:
  device: cuda
  dtype: bfloat16
  local_files_only: true
candidate:
  count: 4
  max_new_tokens: 512
  max_prompt_tokens: 1024
  seed: 20261102
design:
  surrogate_ridge: 0.01
  matrix_ridge: 0.01
  fw_max_iter: 500
  fw_relative_gap: 0.0001
reward:
  l2_regularization: 0.01  # mean BT loss + lambda_RM/2 * ||w||^2
  max_iter: 2000
  gradient_tolerance: 0.000001
  max_weight_norm: 1000.0  # diagnostic only, not a constraint or clipping rule
judges:
  training:
    backend: deepseek
    model: deepseek-flash
    api: chat_completions
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    thinking: disabled
    temperature: 1.0
    max_output_tokens: 64
    max_attempts: 3
    timeout_seconds: 60
  evaluation:
    backend: openai
    model: gpt-6-luna
    api: responses
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    reasoning_effort: low
    max_output_tokens: 1024
    max_attempts: 3
    timeout_seconds: 60
ppo:
  total_episodes: 4096
  response_length: 512
  learning_rate: 0.000003
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  num_mini_batches: 2
  num_ppo_epochs: 2
  local_rollout_forward_batch_size: 4
  kl_coef: 0.05
  cliprange: 0.2
  vf_coef: 0.1
  cliprange_value: 0.2
  gamma: 1.0
  lam: 0.95
  max_grad_norm: 1.0
  lora_r: 8
  lora_alpha: 16
  lora_target_modules: all-linear
evaluation:
  max_new_tokens: 512
  seed: 314159
  answer_orders: [AB, BA]
  comparisons:
    - {name: prism_vs_empirical, left: prism, right: empirical}
    - {name: prism_vs_sft, left: prism, right: sft}
    - {name: empirical_vs_sft, left: empirical, right: sft}
benchmark:
  max_new_tokens: 2048
  temperature: 0
  nltk_data_path: ../assets/nltk_data
